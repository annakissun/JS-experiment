<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Insaynitea</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/users.css">
    <link rel="stylesheet" href="../css/modal.css">
    <script src="../js/modal.js"></script>
</head>
<body>
    <div class="users-container">
        <div class="users-header">
            <h1>👥 Manage Users</h1>
            <div>
                <a href="manager.html" class="back-btn">← Back</a>
            </div>
        </div>
        
        <div id="users-list">
            <div class="loading">Loading users...</div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3>✏️ Edit User</h3>
            <input type="text" id="edit-name" placeholder="Full Name">
            <select id="edit-role">
                <option value="cashier">Cashier</option>
                <option value="manager">Manager</option>
            </select>
            <input type="password" id="edit-password" placeholder="New password (leave blank to keep current)">
            <div class="modal-buttons">
                <button onclick="saveUser()" class="save-btn">Save</button>
                <button onclick="closeEditModal()" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = `${window.location.protocol}//${window.location.hostname}:3000/api`;
        let currentUserId = null;

        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/users`);
                const users = await response.json();
                const container = document.getElementById('users-list');
                
                if (users.length === 0) {
                    container.innerHTML = '<div class="loading">No users found</div>';
                    return;
                }
                
                container.innerHTML = users.map(user => `
                    <div class="user-card">
                        <div class="user-info">
                            <div class="user-name">${user.Name}</div>
                            <div class="user-role">${user.Username} • ${user.Role === 'manager' ? '👑 Manager' : '🛒 Cashier'}</div>
                        </div>
                        <div class="user-actions">
                            <button class="edit-user" onclick="openEditModal(${user.EmployeeID}, '${user.Name}', '${user.Role}')">✏️ Edit</button>
                            <button class="delete-user" onclick="deleteUser(${user.EmployeeID}, '${user.Name}')">🗑️ Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                showError('Failed to load users');
            }
        }

        function openEditModal(id, name, role) {
            currentUserId = id;
            document.getElementById('edit-name').value = name;
            document.getElementById('edit-role').value = role;
            document.getElementById('edit-password').value = '';
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
            currentUserId = null;
        }

        // DELETE USER with modal confirmation
        function deleteUser(id, userName) {
            showModal({
                icon: '👤',
                title: 'Delete User',
                message: `Are you sure you want to delete "${userName}"? This action cannot be undone.`,
                confirmText: 'Yes, Delete',
                cancelText: 'Cancel',
                type: 'danger',
                onConfirm: async () => {
                    try {
                        const response = await fetch(`${API_URL}/users/${id}`, { method: 'DELETE' });
                        if (response.ok) {
                            showModal({
                                icon: '✅',
                                title: 'User Deleted',
                                message: `"${userName}" has been deleted successfully!`,
                                confirmText: 'OK',
                                hideCancel: true,
                                type: 'success',
                                onConfirm: () => loadUsers()
                            });
                        } else {
                            showError('Failed to delete user');
                        }
                    } catch (error) {
                        showError('Server error');
                    }
                }
            });
        }

        // SAVE USER with modal confirmation
        async function saveUser() {
            const name = document.getElementById('edit-name').value;
            const role = document.getElementById('edit-role').value;
            const password = document.getElementById('edit-password').value;
            
            if (!name) {
                showError('Name is required');
                return;
            }
            
            const body = { name, role };
            if (password) body.password = password;
            
            const saveBtn = document.querySelector('#edit-modal .save-btn');
            const originalText = saveBtn.textContent;
            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_URL}/users/${currentUserId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                if (response.ok) {
                    closeEditModal();
                    showModal({
                        icon: '✏️',
                        title: 'User Updated',
                        message: `"${name}" has been updated successfully!`,
                        confirmText: 'OK',
                        hideCancel: true,
                        type: 'success',
                        onConfirm: () => loadUsers()
                    });
                } else {
                    showError('Failed to update user');
                    saveBtn.textContent = originalText;
                    saveBtn.disabled = false;
                }
            } catch (error) {
                showError('Server error');
                saveBtn.textContent = originalText;
                saveBtn.disabled = false;
            }
        }

        // Load users on page load
        loadUsers();
    </script>
</body>
</html>
