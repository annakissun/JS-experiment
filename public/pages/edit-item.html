<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Menu Item - Insaynitea</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/edit-item.css">

    <link rel="stylesheet" href="../css/modal.css">
    <script src="../js/modal.js"></script>
    
</head>
<body>
    <div class="edit-container">
        <a href="manager.html" class="back-link">← Back to Manager Dashboard</a>
        
        <div class="edit-form">
            <h2>✏️ Edit Menu Item</h2>
            <div id="loading-message" class="loading">Loading item details...</div>
            
            <form id="edit-form" style="display: none;">
                <div class="item-id">
                    Item ID: <span id="display-item-id">-</span>
                </div>
                
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" id="edit-name" required>
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <select id="edit-category">
                        <option value="hot">🔥 Hot</option>
                        <option value="iced">❄️ Iced</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Price (RM)</label>
                    <input type="number" id="edit-price" step="0.01" required>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="save-btn">💾 Save Changes</button>
                    <a href="manager.html" class="cancel-btn">❌ Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/edit-item.js"></script>
</body>
</html>
