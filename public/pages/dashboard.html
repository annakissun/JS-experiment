<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analytics - Insaynitea</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/modal.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/modal.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>📊 Dashboard Analytics</h1>
            <div class="button-group">
                <a href="manager.html" class="nav-btn">← Back to Manager</a>
                <a href="reports.html" class="nav-btn">Detailed Reports</a>
                <a href="#" onclick="confirmLogout(() => window.location.href='../index.html')" class="nav-btn">← Logout</a>
            </div>
        </div>

        <!-- Time Filter -->
        <div class="time-filter">
            <button class="filter-btn active" onclick="setPeriod('day')">Today</button>
            <button class="filter-btn" onclick="setPeriod('week')">This Week</button>
            <button class="filter-btn" onclick="setPeriod('month')">This Month</button>
            <button class="filter-btn" onclick="setPeriod('year')">This Year</button>
        </div>

        <!-- KPI Cards -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <!--<div class="kpi-icon">💰</div> -->
                <div class="kpi-info">
                    <div class="kpi-value" id="kpi-revenue">RM0</div>
                    <div class="kpi-label">Total Revenue</div>
                </div>
            </div>
            <div class="kpi-card">
                <!-- <div class="kpi-icon">📦</div> -->
                <div class="kpi-info">
                    <div class="kpi-value" id="kpi-orders">0</div>
                    <div class="kpi-label">Total Orders</div>
                </div>
            </div>
            <div class="kpi-card">
                <!--<div class="kpi-icon">☕</div> -->
                <div class="kpi-info">
                    <div class="kpi-value" id="kpi-items">0</div>
                    <div class="kpi-label">Items Sold</div>
                </div>
            </div>
            <div class="kpi-card">
                <!--<div class="kpi-icon">⭐</div> -->
                <div class="kpi-info">
                    <div class="kpi-value" id="kpi-avg">RM0</div>
                    <div class="kpi-label">Average Order</div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="charts-row">
            <div class="chart-card">
                <h3>📈 Sales Trend</h3>
                <canvas id="salesTrendChart" width="400" height="250"></canvas>
            </div>
            <div class="chart-card">
                <h3>🏆 Top 5 Selling Items</h3>
                <canvas id="topItemsChart" width="400" height="250"></canvas>
            </div>
        </div>

        <div class="charts-row">
            <div class="chart-card">
                <h3>🥧 Sales by Category</h3>
                <canvas id="categoryChart" width="400" height="250"></canvas>
            </div>
            <div class="chart-card">
                <h3>📊 Order Summary</h3>
                <canvas id="orderSummaryChart" width="400" height="250"></canvas>
            </div>
        </div>
    </div>

    <script>
        const API_URL = `${window.location.protocol}//${window.location.hostname}:3000/api`;
        let currentPeriod = 'week';
        let salesChart, topItemsChart, categoryChart, orderSummaryChart;

        async function setPeriod(period) {
            currentPeriod = period;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            await loadDashboardData();
        }

        async function loadDashboardData() {
            try {
                // Get date range based on period
                const dates = getDateRange();
                
                // Fetch data
                const [stats, topItems, orders] = await Promise.all([
                    fetch(`${API_URL}/sales-stats?startDate=${dates.start}&endDate=${dates.end}`).then(r => r.json()),
                    fetch(`${API_URL}/top-items?startDate=${dates.start}&endDate=${dates.end}&limit=5`).then(r => r.json()),
                    fetch(`${API_URL}/orders`).then(r => r.json())
                ]);

                // Update KPIs
                document.getElementById('kpi-revenue').textContent = `RM${(stats.totalRevenue || 0).toFixed(2)}`;
                document.getElementById('kpi-orders').textContent = stats.totalOrders || 0;
                document.getElementById('kpi-items').textContent = stats.totalItems || 0;
                document.getElementById('kpi-avg').textContent = `RM${(stats.avgOrder || 0).toFixed(2)}`;

                // Load charts
                loadSalesTrendChart();
                loadTopItemsChart(topItems);
                loadCategoryChart(orders, dates);
                loadOrderSummaryChart(orders, dates);
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        function getDateRange() {
            const now = new Date();
            let start = new Date();
            
            switch(currentPeriod) {
                case 'day':
                    start = now;
                    break;
                case 'week':
                    start.setDate(now.getDate() - 7);
                    break;
                case 'month':
                    start.setMonth(now.getMonth() - 1);
                    break;
                case 'year':
                    start.setFullYear(now.getFullYear() - 1);
                    break;
                default:
                    start.setDate(now.getDate() - 7);
            }
            
            return {
                start: start.toISOString().split('T')[0],
                end: now.toISOString().split('T')[0]
            };
        }

       async function loadSalesTrendChart() {
    const ctx = document.getElementById('salesTrendChart').getContext('2d');
    
    try {
        // Fetch real daily sales data from database
        const response = await fetch(`${API_URL}/daily-sales?days=7`);
        const data = await response.json();
        
        console.log('Daily sales data:', data); // Debug - check console
        
        // Extract labels and values
        const labels = data.map(item => {
            const date = new Date(item.date);
            return date.toLocaleDateString('en-MY', { weekday: 'short', month: 'short', day: 'numeric' });
        });
        
        const salesData = data.map(item => parseFloat(item.daily_sales) || 0);
        const orderCounts = data.map(item => item.order_count || 0);
        
        if (salesChart) salesChart.destroy();
        
        salesChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Daily Sales (RM)',
                    data: salesData,
                    borderColor: '#4b672f',
                    backgroundColor: 'rgba(75, 103, 47, 0.1)',
                    tension: 0.4,
                    fill: true,
                    yAxisID: 'y'
                }, {
                    label: 'Number of Orders',
                    data: orderCounts,
                    borderColor: '#2c1810',
                    backgroundColor: 'rgba(44, 24, 16, 0.1)',
                    tension: 0.4,
                    fill: true,
                    yAxisID: 'y1',
                    borderDash: [5, 5]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: { position: 'top' },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (context.dataset.label.includes('Sales')) {
                                    return `${label}: RM${context.raw.toFixed(2)}`;
                                }
                                return `${label}: ${context.raw} orders`;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        title: { display: true, text: 'Revenue (RM)' },
                        beginAtZero: true
                    },
                    y1: {
                        position: 'right',
                        title: { display: true, text: 'Number of Orders' },
                        beginAtZero: true,
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        });
        
    } catch (error) {
        console.error('Error loading sales trend chart:', error);
        // Fallback: show message
        document.getElementById('salesTrendChart').parentElement.innerHTML += 
            '<p style="color:red; text-align:center;">No sales data available for chart</p>';
    }
}

        function loadTopItemsChart(items) {
            const ctx = document.getElementById('topItemsChart').getContext('2d');
            
            const labels = items.map(i => i.ItemName);
            const data = items.map(i => parseInt(i.TotalSold));
            
            if (topItemsChart) topItemsChart.destroy();
            topItemsChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Quantity Sold',
                        data: data,
                        backgroundColor: '#4b672f',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { position: 'top' } }
                }
            });
        }

        async function loadCategoryChart(orders, dates) {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            
            // Get category distribution
            const response = await fetch(`${API_URL}/top-items?startDate=${dates.start}&endDate=${dates.end}&limit=10`);
            const items = await response.json();
            
            const hotCount = items.filter(i => i.Category === 'hot').reduce((sum, i) => sum + parseInt(i.TotalSold), 0);
            const icedCount = items.filter(i => i.Category === 'iced').reduce((sum, i) => sum + parseInt(i.TotalSold), 0);
            
            if (categoryChart) categoryChart.destroy();
            categoryChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Hot Coffee', 'Iced Coffee'],
                    datasets: [{
                        data: [hotCount || 1, icedCount || 1],
                        backgroundColor: ['#4b672f', '#322A26'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

       function loadOrderSummaryChart(orders, dates) {
    const ctx = document.getElementById('orderSummaryChart').getContext('2d');
    
    try {
        // Filter orders by selected date range
        const filteredOrders = orders.filter(order => {
            const orderDate = new Date(order.OrderDate).toISOString().split('T')[0];
            return orderDate >= dates.start && orderDate <= dates.end;
        });
        
        if (filteredOrders.length === 0) {
            console.log('No orders in selected date range');
            return;
        }
        
        // Group by date and calculate daily average
        const dailyData = {};
        filteredOrders.forEach(order => {
            const date = new Date(order.OrderDate).toISOString().split('T')[0];
            if (!dailyData[date]) {
                dailyData[date] = { total: 0, count: 0 };
            }
            dailyData[date].total += parseFloat(order.TotalAmount);
            dailyData[date].count++;
        });
        
        // Get last 7 days of data
        const datesList = Object.keys(dailyData).sort().slice(-7);
        const labels = datesList.map(d => {
            const date = new Date(d);
            return date.toLocaleDateString('en-MY', { weekday: 'short', month: 'short', day: 'numeric' });
        });
        const avgValues = datesList.map(d => dailyData[d].total / dailyData[d].count);
        
        if (orderSummaryChart) orderSummaryChart.destroy();
        
        orderSummaryChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Average Order (RM)',
                    data: avgValues,
                    borderColor: '#2c1810',
                    backgroundColor: 'rgba(44, 24, 16, 0.1)',
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: { legend: { position: 'top' } }
            }
        });
        
    } catch (error) {
        console.error('Error loading order summary chart:', error);
    }
}

        // Load default data
        loadDashboardData();
    </script>
</body>
</html>
