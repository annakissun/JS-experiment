<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insaynitea Coffee Shop System</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/modal.css">
    <script src="js/modal.js"></script>
    
    <style>
        /* Landing page specific styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #4b672f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 2rem;
        }
        
        .landing-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .cup {
            width: 120px;
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.2));
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #d8af81;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .main-btn {
            background: #4b672f;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }
        
        .main-btn:hover {
            background: #2c1810;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <img class="cup" src="img/coffee.png" alt="Coffee cup">
        <h1>Insaynitea Coffee</h1>
        
        <div class="button-container">
            <a href="login-cashier.html" class="main-btn">Log in as Cashier</a>
            <a href="login-manager.html" class="main-btn">Log in as Manager</a>
            <a href="signUp.html" class="main-btn">Sign Up</a>
        </div>
    </div>
</body>
</html>
